[project]
name = "forecasting-service"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["training/lightning_logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008", "RUF012", "UP017", "UP038"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["^training/lightning_logs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
