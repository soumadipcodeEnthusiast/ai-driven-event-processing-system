spring:
  application:
    name: ingestion-service

  # ── Kafka ────────────────────────────────────────────────────────────────
  # Serialisers are fixed in KafkaConfig (String keys, raw byte[] values so the DLT
  # receives the original bytes unchanged); the values below document them.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ingestion-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      max-poll-records: 500
      fetch-min-size: 1
      fetch-max-wait: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
    listener:
      ack-mode: MANUAL_IMMEDIATE
      # Consumer threads per instance. Useful total (pods x concurrency) is capped
      # by the raw-events partition count (6); k8s sets 1 so the HPA can use 6 pods.
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: 8080
  shutdown: graceful
  # ── TLS 1.2+ (REQ-047) ───────────────────────────────────────────────────
  # Off by default (local/dev runs plaintext inside the compose/k8s network;
  # in EKS, TLS terminates at the ingress/ALB — infra/k8s/ingress.yaml).
  # SSL_ENABLED=true + a PKCS12 keystore terminates TLS in the service itself.
  ssl:
    enabled: ${SSL_ENABLED:false}
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3
    key-store: ${SSL_KEYSTORE_PATH:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12

# ── Actuator / Observability ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # /actuator/health/liveness and /actuator/health/readiness
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        ingestion.processing: true
      slo:
        ingestion.processing: 500ms   # exact le="0.5" bucket for the ingestion-latency SLO alert

# ── Application-specific ─────────────────────────────────────────────────────
app:
  # ── Security: OAuth 2.0 resource server (REQ-046), see SecurityConfig.java ─
  # Neither URI set → every bearer token is rejected (only the unauthenticated
  # health/prometheus actuator endpoints are reachable).
  security:
    oauth2:
      issuer-uri: ${OAUTH2_ISSUER_URI:}
      jwk-set-uri: ${OAUTH2_JWKS_URL:}
      audience: ${OAUTH2_AUDIENCE:}
  kafka:
    input-topic: ${KAFKA_INPUT_TOPIC:raw-events}
    output-topic: ${KAFKA_OUTPUT_TOPIC:normalized-events}
    dead-letter-topic: ${KAFKA_DLT_TOPIC:raw-events.DLT}
    send-timeout: 30s
    retry:
      max-retries: 3
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 5s
  normalization:
    schema-version: "1.0"
    strict-validation: ${STRICT_VALIDATION:true}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.eventproc: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} - %msg%n"
