---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
# Env vars for anomaly detection (REQ-016 to REQ-020). GraphRAG/Neo4j and LLM
# playbook generation are not in SRS v1.0 scope (docs/adr/0008); this service
# keeps only in-memory baselines (relearned after a restart), so it carries no
# PVC and no graph/LLM secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: diagnostic-config
  namespace: event-processor
  labels:
    app.kubernetes.io/name: diagnostic-service
    app.kubernetes.io/part-of: ai-driven-event-processor
data:
  MODEL_VERSION: "ewma-zscore-1.0"
  ANOMALY_THRESHOLD: "0.8"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  ANOMALY_AUDIT_TOPIC: "anomaly-audit"
  # REQ-016: every replica joins this group and scores its share of events.
  EVENT_CONSUMER_ENABLED: "true"
  EVENT_INPUT_TOPIC: "normalized-events"
  # REQ-046: set to "true" with your IdP's JWKS URL (e.g. a Cognito user pool).
  OAUTH2_ENABLED: "false"
  OAUTH2_JWKS_URL: ""
  OAUTH2_ISSUER: ""
  OAUTH2_AUDIENCE: ""
  HOME: "/tmp"

---
# ─── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-service
  namespace: event-processor
  labels:
    app.kubernetes.io/name: diagnostic-service
    app.kubernetes.io/component: diagnostics
    app.kubernetes.io/part-of: ai-driven-event-processor
spec:
  # Stateless (no playbook store); safe to run >1 replica and roll normally.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: diagnostic-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diagnostic-service
        app.kubernetes.io/component: diagnostics
        app.kubernetes.io/part-of: ai-driven-event-processor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: diagnostic-service
          image: ghcr.io/your-org/diagnostic-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: diagnostic-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}

---
# ─── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: diagnostic-service
  namespace: event-processor
  labels:
    app.kubernetes.io/name: diagnostic-service
    app.kubernetes.io/component: diagnostics
    app.kubernetes.io/part-of: ai-driven-event-processor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: diagnostic-service
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
