---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestion-config
  namespace: event-processor
  labels:
    app.kubernetes.io/name: ingestion-service
    app.kubernetes.io/part-of: ai-driven-event-processor
data:
  # Adjust to your cluster's Kafka bootstrap service.
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_INPUT_TOPIC: "raw-events"
  # One consumer thread per pod; see hpa.yaml for the partition maths.
  KAFKA_LISTENER_CONCURRENCY: "1"
  # Don't expose Kafka/component details on unauthenticated health endpoints.
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"
  KAFKA_OUTPUT_TOPIC: "normalized-events"
  KAFKA_DLT_TOPIC: "raw-events.DLT"
  STRICT_VALIDATION: "true"
  # Expose /actuator/health/{liveness,readiness} even outside auto-detection.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

---
# ─── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: event-processor
  labels:
    app.kubernetes.io/name: ingestion-service
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: ai-driven-event-processor
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
spec:
  # Replica count is owned by the HPA (min 2); kept here for first apply.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-service
        app.kubernetes.io/component: consumer
        app.kubernetes.io/part-of: ai-driven-event-processor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestion-service
          image: ghcr.io/your-org/ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ingestion-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}

---
# ─── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: event-processor
  labels:
    app.kubernetes.io/name: ingestion-service
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: ai-driven-event-processor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingestion-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
