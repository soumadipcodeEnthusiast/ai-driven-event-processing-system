---
# ─── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: event-processor
  labels:
    app.kubernetes.io/part-of: ai-driven-event-processor

---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestion-config
  namespace: event-processor
data:
  KAFKA_INPUT_TOPIC: "raw-events"
  KAFKA_OUTPUT_TOPIC: "normalized-events"
  KAFKA_DLT_TOPIC: "raw-events.DLT"
  STRICT_VALIDATION: "true"

---
# ─── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: event-processor
  labels:
    app.kubernetes.io/name: ingestion-service
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: ai-driven-event-processor
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-service
        app.kubernetes.io/component: consumer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ingestion-service
          image: ghcr.io/your-org/ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ingestion-config
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

---
# ─── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: event-processor
  labels:
    app.kubernetes.io/name: ingestion-service
    app.kubernetes.io/component: consumer
spec:
  selector:
    app.kubernetes.io/name: ingestion-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
