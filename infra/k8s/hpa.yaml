---
# ─── HorizontalPodAutoscaler — ingestion-service ──────────────────────────────
# Scales the ingestion-service based on CPU utilisation.
# Ceiling: raw-events has 6 partitions (infra/docker-compose.yml kafka-init) and
# each pod runs KAFKA_LISTENER_CONCURRENCY=1 consumer thread (ingestion-config),
# so 6 pods = 6 consumers. Keep maxReplicas x concurrency <= partitions; add
# partitions before raising either. CPU only: JVM heap sits near its max by
# design, so a memory target would pin the HPA at maxReplicas.
# For Kafka consumer lag-based scaling, replace the CPU metric with a custom
# metric from the Kafka Lag Exporter (see docs/PLAN.md Phase 5).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-service-hpa
  namespace: event-processor
  labels:
    app.kubernetes.io/name: ingestion-service
    app.kubernetes.io/component: consumer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # ── CPU utilisation ────────────────────────────────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

# ─── No HPA for forecasting-service / diagnostic-service (intentional) ────────
# Both are pinned to exactly 1 replica (Deployment replicas: 1, Recreate):
#   - forecasting-service keeps alerts in memory and runs the forecast loop in
#     every pod; N replicas => duplicate alerts and divergent GET /alerts.
#     See docs/adr/0007-in-memory-alert-store.md.
#   - diagnostic-service uses a single-writer file-based playbook store on a
#     ReadWriteOnce PVC. See docs/adr/0005-file-based-json-playbook-store.md.
# Re-add autoscalers only after those ADRs are superseded (shared store +
# leader election for the forecast loop).
