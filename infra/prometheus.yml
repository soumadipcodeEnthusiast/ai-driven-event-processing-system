global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: ai-driven-event-processor

# ─── Recording + alerting rules ───────────────────────────────────────────────
# infra/prometheus/rules/*.yml is mounted at /etc/prometheus/rules (CONTRACTS §8).
# Unit tests live in rules/tests/ and are NOT loaded (they don't match *.yml at
# this level). Validate with:
#   promtool check config infra/prometheus.yml
#   promtool check rules infra/prometheus/rules/*.yml
#   promtool test rules  infra/prometheus/rules/tests/*.yml
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ─── Alertmanager (optional — configure when routing alerts externally) ───────
# Alerts are visible in the Prometheus UI (http://localhost:9090/alerts) and in
# the Grafana "Service Health" dashboard without an Alertmanager.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# ─── Scrape configs ───────────────────────────────────────────────────────────
# Every application job adds a `service` label (CONTRACTS §7). Dashboards and
# alert rules select on `service`, not on `job`.
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    relabel_configs:
      - target_label: service
        replacement: prometheus

  # ingestion-service — Spring Boot Actuator /actuator/prometheus
  - job_name: ingestion-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - ingestion-service:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: ingestion-service

  # forecasting-service — FastAPI /metrics
  - job_name: forecasting-service
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - forecasting-service:8081
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: forecasting-service

  # diagnostic-service — FastAPI /metrics
  - job_name: diagnostic-service
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - diagnostic-service:8082
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: diagnostic-service

  # Grafana — serves the REQ-K dashboard; /metrics is enabled by default.
  - job_name: grafana
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - grafana:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: grafana

  # Kafka JMX exporter (optional — enable when jmx-exporter sidecar is added)
  # - job_name: kafka
  #   static_configs:
  #     - targets:
  #         - kafka:7071
