version: "3.9"

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  event-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  zookeeper-data:
  kafka-data:
  prometheus-data:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Zookeeper ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka broker ───────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Topic initialiser (runs once, then exits) ──────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      bash -c "
        kafka-topics --create --if-not-exists --topic raw-events
          --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic normalized-events
          --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --topic raw-events.DLT
          --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 &&
        echo 'Topics created successfully.'
      "
    networks:
      - event-net
    restart: "no"

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Ingestion Service (Java Spring Boot) ───────────────────────────────────
  ingestion-service:
    build:
      context: ../ingestion-service
      dockerfile: Dockerfile
    container_name: ingestion-service
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: raw-events
      KAFKA_OUTPUT_TOPIC: normalized-events
      KAFKA_DLT_TOPIC: raw-events.DLT
      STRICT_VALIDATION: "true"
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
    restart: on-failure

  # ── Forecasting Service (Python FastAPI) ───────────────────────────────────
  forecasting-service:
    build:
      context: ../forecasting-service
      dockerfile: Dockerfile
    container_name: forecasting-service
    ports:
      - "8081:8081"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      FORECAST_WINDOW_MINUTES: "60"
      TFT_MODEL_VERSION: "0.0.0-stub"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: on-failure

  # ── Diagnostic Service (Python FastAPI) ────────────────────────────────────
  diagnostic-service:
    build:
      context: ../diagnostic-service
      dockerfile: Dockerfile
    container_name: diagnostic-service
    ports:
      - "8082:8082"
    environment:
      GRAPH_DB_URL: bolt://neo4j:7687
      GRAPH_DB_USER: neo4j
      GRAPH_DB_PASSWORD: changeme
      LLM_API_URL: http://ollama:11434
      LLM_MODEL: llama3
    depends_on:
      - ingestion-service
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: on-failure
