# GENERATED by infra/prometheus/gen_slo_rules.py (python3 infra/prometheus/gen_slo_rules.py infra/prometheus/rules) — do not edit by hand — SLO recording rules.
# SLO definitions: docs/SLO.md. Naming: level:metric:operation (Prometheus conventions).
#   slo:objective:ratio{slo,service}            target (e.g. 0.999)
#   slo:sli_error:ratio_rate<W>{slo,service}     bad/total over window W
#   slo:error_budget:remaining_ratio{slo,service} 1 - consumed budget over 30d (can go < 0)
#   slo:burn_rate:ratio_rate1h{slo,service}      error ratio / (1 - objective)
groups:
  - name: slo-objectives
    interval: 1m
    rules:
      - record: slo:objective:ratio
        expr: vector(0.999)
        labels: {slo: ingestion-availability, service: ingestion-service}
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels: {slo: ingestion-latency, service: ingestion-service}
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels: {slo: forecast-availability, service: forecasting-service}
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels: {slo: forecast-latency, service: forecasting-service}
      - record: slo:objective:ratio
        expr: vector(0.995)
        labels: {slo: service-availability, service: all}
  - name: slo-ingestion-availability
    # REQ-001/REQ-005: events consumed without an unexpected processing error (outcome!=error); objective 99.9% over 30d
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: |
          sum(rate(ingestion_events_total{outcome="error"}[5m]))
          /
          sum(rate(ingestion_events_total[5m]))
        labels: {slo: ingestion-availability, service: ingestion-service}
      - record: slo:sli_error:ratio_rate30m
        expr: |
          sum(rate(ingestion_events_total{outcome="error"}[30m]))
          /
          sum(rate(ingestion_events_total[30m]))
        labels: {slo: ingestion-availability, service: ingestion-service}
      - record: slo:sli_error:ratio_rate1h
        expr: |
          sum(rate(ingestion_events_total{outcome="error"}[1h]))
          /
          sum(rate(ingestion_events_total[1h]))
        labels: {slo: ingestion-availability, service: ingestion-service}
      - record: slo:sli_error:ratio_rate2h
        expr: |
          sum(rate(ingestion_events_total{outcome="error"}[2h]))
          /
          sum(rate(ingestion_events_total[2h]))
        labels: {slo: ingestion-availability, service: ingestion-service}
      - record: slo:sli_error:ratio_rate6h
        expr: |
          sum(rate(ingestion_events_total{outcome="error"}[6h]))
          /
          sum(rate(ingestion_events_total[6h]))
        labels: {slo: ingestion-availability, service: ingestion-service}
      - record: slo:sli_error:ratio_rate1d
        expr: |
          sum(rate(ingestion_events_total{outcome="error"}[1d]))
          /
          sum(rate(ingestion_events_total[1d]))
        labels: {slo: ingestion-availability, service: ingestion-service}
      - record: slo:sli_error:ratio_rate3d
        expr: |
          sum(rate(ingestion_events_total{outcome="error"}[3d]))
          /
          sum(rate(ingestion_events_total[3d]))
        labels: {slo: ingestion-availability, service: ingestion-service}
      - record: slo:sli_error:ratio_rate30d
        expr: |
          sum(rate(ingestion_events_total{outcome="error"}[30d]))
          /
          sum(rate(ingestion_events_total[30d]))
        labels: {slo: ingestion-availability, service: ingestion-service}
  - name: slo-ingestion-latency
    # REQ-004: events processed in < 500 ms; objective 99% over 30d
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: |
          (sum(rate(ingestion_processing_seconds_count[5m])) - sum(rate(ingestion_processing_seconds_bucket{le="0.5"}[5m])))
          /
          sum(rate(ingestion_processing_seconds_count[5m]))
        labels: {slo: ingestion-latency, service: ingestion-service}
      - record: slo:sli_error:ratio_rate30m
        expr: |
