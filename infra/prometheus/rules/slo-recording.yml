  - name: slo-service-availability
    # Scrape availability (up) of the three application services; objective 99.5% over 30d
    rules:
      - record: service:up:avg_over_time5m
        expr: avg by (service) (avg_over_time(up{job=~"ingestion-service|forecasting-service|diagnostic-service"}[5m]))
      - record: service:up:avg_over_time1h
        expr: avg by (service) (avg_over_time(up{job=~"ingestion-service|forecasting-service|diagnostic-service"}[1h]))
      - record: service:up:avg_over_time1d
        expr: avg by (service) (avg_over_time(up{job=~"ingestion-service|forecasting-service|diagnostic-service"}[1d]))
      - record: service:up:avg_over_time30d
        expr: avg by (service) (avg_over_time(up{job=~"ingestion-service|forecasting-service|diagnostic-service"}[30d]))
      - record: slo:sli_error:ratio_rate30d
        expr: 1 - avg(service:up:avg_over_time30d)
        labels: {slo: service-availability, service: all}
  - name: slo-error-budget
    interval: 1m
    rules:
      - record: slo:error_budget:remaining_ratio
        expr: 1 - (slo:sli_error:ratio_rate30d / on (slo, service) (1 - slo:objective:ratio))
      - record: slo:burn_rate:ratio_rate1h
        expr: slo:sli_error:ratio_rate1h / on (slo, service) (1 - slo:objective:ratio)
      - record: slo:burn_rate:ratio_rate6h
        expr: slo:sli_error:ratio_rate6h / on (slo, service) (1 - slo:objective:ratio)
      - record: slo:burn_rate:ratio_rate3d
        expr: slo:sli_error:ratio_rate3d / on (slo, service) (1 - slo:objective:ratio)
