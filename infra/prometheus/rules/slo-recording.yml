    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: |
          (sum(rate(forecast_latency_seconds_count[5m])) - sum(rate(forecast_latency_seconds_bucket{le=~"2|2\\.0"}[5m])))
          /
          sum(rate(forecast_latency_seconds_count[5m]))
        labels: {slo: forecast-latency, service: forecasting-service}
      - record: slo:sli_error:ratio_rate30m
        expr: |
