          /
          sum(rate(ingestion_processing_seconds_count[1d]))
        labels: {slo: ingestion-latency, service: ingestion-service}
      - record: slo:sli_error:ratio_rate3d
        expr: |
          (sum(rate(ingestion_processing_seconds_count[3d])) - sum(rate(ingestion_processing_seconds_bucket{le="0.5"}[3d])))
