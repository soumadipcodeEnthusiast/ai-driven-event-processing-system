# promtool unit tests for key alerts.
#   promtool test rules infra/prometheus/rules/tests/*.yml
rule_files:
  - ../aiops-recording.yml
  - ../aiops-alerts.yml

evaluation_interval: 1m

tests:
  # ── ServiceDown ────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'up{job="ingestion-service", service="ingestion-service", instance="ingestion-service:8080"}'
        values: '1 1 0 0 0 0'
      - series: 'up{job="forecasting-service", service="forecasting-service", instance="forecasting-service:8081"}'
        values: '1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 4m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: ingestion-service
              service: ingestion-service
              instance: ingestion-service:8080
            exp_annotations:
              summary: "ingestion-service is down (Prometheus scrape failing)"
              description: "Prometheus has failed to scrape ingestion-service (ingestion-service:8080) for more than 1 minute."
              runbook_url: "https://github.com/soumadipcodeEnthusiast/ai-driven-event-processing-system/blob/main/docs/runbooks/service-down.md"

  # ── IngestionConsumerLagHigh (REQ-001/REQ-004: 5000 records ≈ 500 ms @ 10k ev/s) ─
  - interval: 1m
    input_series:
      - series: 'kafka_consumer_fetch_manager_records_lag_max{service="ingestion-service", client_id="consumer-1"}'
        values: '6000x25'
    alert_rule_test:
      - eval_time: 3m
        alertname: IngestionConsumerLagHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: IngestionConsumerLagHigh
        exp_alerts:
          - exp_labels:
              severity: critical
              service: ingestion-service
            exp_annotations:
              summary: "Ingestion consumer lag > 5000 records (> 500 ms at 10k ev/s, REQ-001/REQ-004)"
              description: "Max records lag is 6000 records for 5 minutes."
              runbook_url: "https://github.com/soumadipcodeEnthusiast/ai-driven-event-processing-system/blob/main/docs/runbooks/ingestion-consumer-lag-high.md"

  # ── AnomalyAuditPublishFailing ────────────────────────────────────────────
  # The expected "30" assumes the 30m increase() window at eval_time 60m falls
  # entirely within the linear counter growth starting at t=0.
  - interval: 1m
    input_series:
      - series: 'anomaly_audit_publish_failures_total{service="diagnostic-service"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: AnomalyAuditPublishFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: diagnostic-service
            exp_annotations:
              summary: "diagnostic-service is failing to publish anomalies to the audit topic"
              description: "30 audit-publish failures in the last 30m (REQ-019 at risk)."
              runbook_url: "https://github.com/soumadipcodeEnthusiast/ai-driven-event-processing-system/blob/main/docs/runbooks/anomaly-audit-publish-failing.md"

  # ── EventArchiveUploadFailing (REQ-028) ──────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'archive_failures_total{service="event-archiver", topic="raw-events"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: EventArchiveUploadFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: event-archiver
            exp_annotations:
              summary: "event-archiver is failing to write batches to S3"
              description: "15 failed S3 uploads in the last 15m. Records are rewound and retried, so nothing is lost yet, but the archive (REQ-028) is falling behind."
              runbook_url: "https://github.com/soumadipcodeEnthusiast/ai-driven-event-processing-system/blob/main/docs/runbooks/event-archive-failing.md"

  # ── EventArchiveStalled: fires only while events are flowing ─────────────────
  - interval: 1m
    input_series:
      - series: 'archive_last_success_timestamp_seconds{service="event-archiver"}'
        values: '0x30'
      - series: 'ingestion_events_total{service="ingestion-service", outcome="valid"}'
        values: '0+100x30'
    alert_rule_test:
      # time() - 0 exceeds 900 s after minute 15, plus `for: 5m`
      - eval_time: 14m
        alertname: EventArchiveStalled
        exp_alerts: []
      - eval_time: 25m
        alertname: EventArchiveStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              service: event-archiver
            exp_annotations:
              summary: "No events archived to S3 for 15+ minutes"
              description: "Ingestion is processing events but event-archiver has not completed an upload in 15m (REQ-028)."
              runbook_url: "https://github.com/soumadipcodeEnthusiast/ai-driven-event-processing-system/blob/main/docs/runbooks/event-archive-failing.md"

  - interval: 1m
    input_series:
      # healthy: a successful upload every minute
      - series: 'archive_last_success_timestamp_seconds{service="event-archiver"}'
        values: '0+60x30'
      - series: 'ingestion_events_total{service="ingestion-service", outcome="valid"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: EventArchiveStalled
        exp_alerts: []

  # ── PredictiveAlertCritical catches a brand-new labelled series ──────────────
  - interval: 1m
    input_series:
      - series: 'predictive_alerts_total{service="forecasting-service", component="kafka", severity="critical"}'
        values: '_x5 1x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: PredictiveAlertCritical
        exp_alerts: []
      - eval_time: 6m
        alertname: PredictiveAlertCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              service: forecasting-service
              component: kafka
            exp_annotations:
              summary: "Critical predicted breach for kafka"
              description: "The forecasting service predicts a >= 50% threshold overshoot for kafka. Check the Service Health dashboard and GET /alerts."
              runbook_url: "https://github.com/soumadipcodeEnthusiast/ai-driven-event-processing-system/blob/main/docs/runbooks/predictive-alert-critical.md"
              dashboard: "http://localhost:9030/d/aiops-service-health"
      - eval_time: 18m
        alertname: PredictiveAlertCritical
        exp_alerts: []

  # ── ForecastLoopStalled ──────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'up{job="forecasting-service", service="forecasting-service", instance="forecasting-service:8081"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: ForecastLoopStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              service: forecasting-service
            exp_annotations:
              summary: "Forecasting background loop has not run in 10+ minutes"
              description: "forecasting-service is up but recorded no forecast runs in 10m; no PredictiveAlerts can be emitted."
              runbook_url: "https://github.com/soumadipcodeEnthusiast/ai-driven-event-processing-system/blob/main/docs/runbooks/forecast-loop-stalled.md"
  - interval: 1m
    input_series:
      - series: 'up{job="forecasting-service", service="forecasting-service", instance="forecasting-service:8081"}'
        values: '1x30'
      - series: 'forecast_runs_total{service="forecasting-service", component="kafka", outcome="ok"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ForecastLoopStalled
        exp_alerts: []
