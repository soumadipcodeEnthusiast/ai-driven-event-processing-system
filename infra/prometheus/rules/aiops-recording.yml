# Golden-signal recording rules used by the Grafana dashboards and alert rules.
# Metric names are fixed by docs/CONTRACTS.md §7 — do not rename.
groups:
  - name: aiops-ingestion-recording
    rules:
      - record: outcome:ingestion_events:rate1m
        expr: sum by (outcome) (rate(ingestion_events_total[1m]))
      - record: service:ingestion_events_invalid:ratio_rate10m
        expr: |
          sum(rate(ingestion_events_total{outcome="invalid"}[10m]))
          /
          sum(rate(ingestion_events_total[10m]))
        labels: {service: ingestion-service}
      - record: service:ingestion_processing_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(ingestion_processing_seconds_bucket[5m])))
        labels: {service: ingestion-service}
      - record: service:ingestion_processing_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(ingestion_processing_seconds_bucket[5m])))
        labels: {service: ingestion-service}
      - record: service:kafka_consumer_records_lag:max
        expr: max(kafka_consumer_fetch_manager_records_lag_max{service="ingestion-service"} >= 0)
        labels: {service: ingestion-service}

  - name: aiops-forecasting-recording
    rules:
      - record: service:forecast_latency_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(forecast_latency_seconds_bucket[5m])))
        labels: {service: forecasting-service}
      - record: component_outcome:forecast_runs:rate5m
        expr: sum by (component, outcome) (rate(forecast_runs_total[5m]))

  # Anomaly detection (REQ-016 to REQ-020, docs/adr/0008). diagnostic-service's
  # earlier GraphRAG/LLM/playbook recording rules (diagnosis_latency_seconds,
  # graph_context_seconds, llm_request_seconds, llm_failures_total,
  # diagnoses_total) are retired along with that design.
  - name: aiops-diagnostic-recording
    rules:
      - record: service:anomaly_scoring_latency_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(anomaly_scoring_latency_seconds_bucket[5m])))
        labels: {service: diagnostic-service}
      - record: service:anomalies_detected:rate5m
        expr: sum(rate(anomalies_detected_total[5m]))
        labels: {service: diagnostic-service}
      - record: service:anomaly_audit_publish_failures:increase30m
        expr: sum(increase(anomaly_audit_publish_failures_total[30m]))
        labels: {service: diagnostic-service}
      - record: service:anomaly_events_scored:rate5m
        expr: sum(rate(anomaly_events_scored_total[5m]))
        labels: {service: diagnostic-service}

  # S3 archival (REQ-028).
  - name: aiops-archive-recording
    rules:
      - record: topic:archive_records:rate5m
        expr: sum by (topic) (rate(archive_records_total[5m]))
      - record: service:archive_failures:increase15m
        expr: sum(increase(archive_failures_total[15m]))
        labels: {service: event-archiver}
