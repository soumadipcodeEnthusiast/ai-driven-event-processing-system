# Grafana datasource provisioning (mounted at /etc/grafana/provisioning).
# UIDs are fixed: dashboards reference datasources by uid.
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Infinity
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

# The Infinity datasource (yesoreyeram-infinity-datasource) and the
# aiops-overview dashboard that used it to read /alerts and /playbooks are
# removed along with the GraphRAG/LLM/playbook design — see docs/adr/0008.
# `deleteDatasources` above still removes it from any Grafana instance
# provisioned by an earlier version of this file.
