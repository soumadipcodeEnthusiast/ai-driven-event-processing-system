spring:
  application:
    name: ingestion-service

  # ── Kafka ────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ingestion-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500
      fetch-min-size: 1
      fetch-max-wait: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: 8080
  shutdown: graceful

# ── Actuator / Observability ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# ── Application-specific ─────────────────────────────────────────────────────
app:
  kafka:
    input-topic: ${KAFKA_INPUT_TOPIC:raw-events}
    output-topic: ${KAFKA_OUTPUT_TOPIC:normalized-events}
    dead-letter-topic: ${KAFKA_DLT_TOPIC:raw-events.DLT}
  normalization:
    schema-version: "1.0"
    strict-validation: ${STRICT_VALIDATION:true}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.eventproc: DEBUG
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
