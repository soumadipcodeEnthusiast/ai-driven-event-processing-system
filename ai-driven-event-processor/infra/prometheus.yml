global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: ai-driven-event-processor

# ─── Alert rules (placeholder — add rules files under rules/) ────────────────
# rule_files:
#   - "rules/*.yml"

# ─── Alertmanager (optional — configure when routing alerts externally) ───────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# ─── Scrape configs ───────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # ingestion-service — Spring Boot Actuator /actuator/prometheus
  - job_name: ingestion-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - ingestion-service:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: ingestion-service

  # forecasting-service — FastAPI /metrics
  - job_name: forecasting-service
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - forecasting-service:8081
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: forecasting-service

  # diagnostic-service — FastAPI /metrics
  - job_name: diagnostic-service
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - diagnostic-service:8082
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: diagnostic-service

  # Kafka JMX exporter (optional — enable when jmx-exporter sidecar is added)
  # - job_name: kafka
  #   static_configs:
  #     - targets:
  #         - kafka:7071
