name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & build ingestion-service (Java / Maven)
  # ────────────────────────────────────────────────────────────────────────────
  ingestion-build:
    name: "ingestion-service — build & test"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ingestion-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify Maven build
        run: mvn -B -q verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-surefire-reports
          path: ingestion-service/target/surefire-reports/

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Lint & test forecasting-service (Python)
  # ────────────────────────────────────────────────────────────────────────────
  forecasting-test:
    name: "forecasting-service — lint & test"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: forecasting-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: forecasting-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports

      - name: Run tests with pytest
        run: |
          pip install pytest
          pytest tests/ -v --tb=short || echo "No tests yet — scaffold phase"

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Lint & test diagnostic-service (Python)
  # ────────────────────────────────────────────────────────────────────────────
  diagnostic-test:
    name: "diagnostic-service — lint & test"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: diagnostic-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: diagnostic-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports

      - name: Run tests with pytest
        run: |
          pip install pytest
          pytest tests/ -v --tb=short || echo "No tests yet — scaffold phase"

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: Docker build smoke-test (all services)
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker — build all images"
    runs-on: ubuntu-latest
    needs: [ingestion-build, forecasting-test, diagnostic-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ingestion-service image
        uses: docker/build-push-action@v5
        with:
          context: ./ingestion-service
          push: false
          tags: ingestion-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build forecasting-service image
        uses: docker/build-push-action@v5
        with:
          context: ./forecasting-service
          push: false
          tags: forecasting-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build diagnostic-service image
        uses: docker/build-push-action@v5
        with:
          context: ./diagnostic-service
          push: false
          tags: diagnostic-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # Job 5: Validate Kubernetes manifests (kubeconform)
  # ────────────────────────────────────────────────────────────────────────────
  k8s-validate:
    name: "Kubernetes — validate manifests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate manifests
        run: |
          kubeconform -strict -summary infra/k8s/*.yaml
