name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  KUBECONFORM_VERSION: "v0.8.0"
  HADOLINT_VERSION: "v2.12.0"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # ingestion-service (Java / Maven wrapper)
  # ──────────────────────────────────────────────────────────────────────────
  ingestion-build:
    name: "ingestion-service — build & test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ingestion-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify (compile, test, package)
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -B verify
          else
            echo "::warning::mvnw not found, falling back to system mvn"
            mvn -B verify
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-surefire-reports
          path: ingestion-service/target/surefire-reports/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # Python services: ruff, mypy, pytest (all blocking)
  # Tests must pass without ML deps, network, Kafka or an LLM (CONTRACTS §6).
  # ──────────────────────────────────────────────────────────────────────────
  python-test:
    name: "${{ matrix.service }} — lint, typecheck & test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [forecasting-service, diagnostic-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            ${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies (core + dev, no ML)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Test (pytest)
        run: pytest -v --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # Infra lint: compose config, shell scripts, Dockerfiles
  # ──────────────────────────────────────────────────────────────────────────
  infra-lint:
    name: "Infra — compose, shell & Dockerfile lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose (all profiles)
        run: |
          docker compose -f infra/docker-compose.yml config -q
          docker compose -f infra/docker-compose.yml --profile llm --profile neo4j config -q

      - name: Prometheus — check config/rules, run rule unit tests, verify generated SLO rules
        run: |
          PROM=prom/prometheus:v2.52.0
          # run() mounts $PWD/infra as /infra inside the container (working dir /infra).
          # Paths passed to it must be relative to /infra (strip the leading "infra/").
          run() { docker run --rm -v "$PWD/infra:/infra" -w /infra --entrypoint promtool "$PROM" "$@"; }

          # 1. Generate SLO rules so infra/prometheus/rules/*.yml exist on the host
          python3 infra/prometheus/gen_slo_rules.py infra/prometheus/rules

          # 2. Build file lists with find (avoids host shell-glob expansion against the
          #    repo root where "prometheus/rules/" does not exist), then strip "infra/"
          #    so the paths are relative to /infra inside the container.
          RULE_FILES=$(find infra/prometheus/rules -maxdepth 1 -name '*.yml' | sed 's|^infra/||' | tr '\n' ' ')
          TEST_FILES=$(find infra/prometheus/rules/tests -name '*.yml' | sed 's|^infra/||' | tr '\n' ' ')

          # 3. Validate rules and run unit tests
          # shellcheck disable=SC2086
          run check rules $RULE_FILES
          # shellcheck disable=SC2086
          run test rules $TEST_FILES

          # 4. prometheus.yml references /etc/prometheus/rules — verify config with rules mounted
          docker run --rm \
            -v "$PWD/infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/infra/prometheus/rules:/etc/prometheus/rules:ro" \
            --entrypoint promtool "$PROM" check config /etc/prometheus/prometheus.yml

          # 5. Verify committed rules match generated output (fail if stale)
          git diff --exit-code -- infra/prometheus/rules/ || {
            echo "SLO rules are stale: run python3 infra/prometheus/gen_slo_rules.py infra/prometheus/rules"
            exit 1
          }

      - name: Prometheus — every rule file is shipped to Kubernetes
        run: |
          for f in infra/prometheus/rules/*.yml; do
            grep -q "prometheus/rules/$(basename "$f")" infra/kustomization.yaml \
              || { echo "$f missing from configMapGenerator in infra/kustomization.yaml"; exit 1; }
          done

      - name: Shell scripts — bash -n and shellcheck
        run: |
          shopt -s nullglob
          scripts=(scripts/*.sh)
          for s in "${scripts[@]}"; do bash -n "$s"; done
          shellcheck --version
          shellcheck "${scripts[@]}"

      - name: Dockerfiles — hadolint
        run: |
          for f in ingestion-service/Dockerfile forecasting-service/Dockerfile diagnostic-service/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:${HADOLINT_VERSION} hadolint --failure-threshold error - < "$f"
          done

  # ──────────────────────────────────────────────────────────────────────────
  # Docker image builds (no push)
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker — build ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ingestion-build, python-test, infra-lint]
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-service, forecasting-service, diagnostic-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: false
          tags: ${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ──────────────────────────────────────────────────────────────────────────
  # Kubernetes manifests (kubeconform, strict, pinned)
  # ──────────────────────────────────────────────────────────────────────────
  k8s-validate:
    name: "Kubernetes — validate manifests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform ${{ env.KUBECONFORM_VERSION }}
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate raw manifests
        # Kustomization has no upstream JSON schema; it is validated by rendering below.
        run: kubeconform -strict -summary -skip Kustomization infra/k8s/

      - name: Validate rendered kustomization
        run: kubectl kustomize infra | kubeconform -strict -summary -
